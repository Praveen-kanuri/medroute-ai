[project]
name = "medroute-ai-backend"
version = "0.1.0"
description = "MedRoute AI backend - open-model-first healthcare appointment navigation assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2",
    "groq>=1.6.0",
    "deepgram-sdk>=7.6.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL instance (see README).",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends() is designed to be used as an argument default.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
